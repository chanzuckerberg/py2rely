[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py2rely"
requires-python = ">=3.9"
version = "0.7.1"
dependencies = [
    "scipy",
    "gradio",
    "copick",
    "mrcfile",
    "slabpick",
    "starfile",
    "pydantic",
    "submitit",
    "rich-click",
    "ccpem-pipeliner",
    "zarr-particle-tools",
    "fastmcp>=2.0.0",
]
authors = [
  { name = "Jonathan Schwartz", email = "jonathan.schwartz@czii.org" }
  ]
description = "Command line tools to Run Automated Sub-Tomogram Averaging with Relion and CCPEM Pipeline."
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",        
    "Programming Language :: Python :: 3.9",    
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.optional-dependencies]
web = ["gradio", "pytz"]
gui = ["PyQt5", "pyqtgraph"]
dashboard = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "watchdog>=4.0.0",
    "websockets>=12.0",
]

[project.scripts]
py2rely = "py2rely.main:routines"
py2rely-slurm = "py2rely.main:slurm_routines"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["py2rely"]
include = [
    "py2rely/**/*.py",
    "py2rely/dashboard/frontend/dist/**",
]

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.ruff]
select = ["E","W","F","B","I","N","ASYNC","COM","C4","DTZ","ISC","G","T20","SIM"]
line-length = 120
target-version = "py39"

[tool.ruff.isort]
known-first-party = ["py2rely"]

[tool.ruff.flake8-quotes]
docstring-quotes = "double"

[tool.mypy]
show_error_codes = true
ignore_missing_imports = true
warn_unreachable = true
strict = true
